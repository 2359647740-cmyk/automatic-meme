<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澄己 · Self-Still — 观照台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@200;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  /* ================= 设计令牌（默认主题：aurum 暗夜金） ================= */
  :root {
    --bg: #0b0c10;
    --bg-soft: #12141b;
    --card: rgba(255, 255, 255, .035);
    --card-solid: #16181f;
    --card-hover: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .09);
    --text: #eceae3;
    --text-dim: #a09d94;
    --text-faint: #68655e;
    --accent: #d4a24e;
    --accent-2: #7ba7bc;
    --accent-dim: rgba(212, 162, 78, .13);
    --accent-text: #16130c;
    --radius: 18px;
    --tracking: .02em;
    --font-body: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --font-display: "Noto Serif SC", "Songti SC", Georgia, serif;
    --font-num: "Space Grotesk", -apple-system, sans-serif;
    --glow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-body); font-size: 15px; line-height: 1.75;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    transition: background .5s ease, color .5s ease;
  }
  ::selection { background: var(--accent-dim); }

  /* ================= 氛围层：极光背景 ================= */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .aurora i {
    position: absolute; border-radius: 50%; filter: blur(100px); opacity: .5;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1) { width: 44vw; height: 44vw; left: -12vw; top: -14vw; background: var(--accent); opacity: .16; }
  .aurora i:nth-child(2) { width: 36vw; height: 36vw; right: -10vw; top: 18vh; background: var(--accent-2); opacity: .13; animation-delay: -8s; }
  .aurora i:nth-child(3) { width: 30vw; height: 30vw; left: 30vw; bottom: -16vw; background: var(--accent); opacity: .1; animation-delay: -15s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(6vw, 4vh) scale(1.15); }
  }

  /* ================= 顶栏 ================= */
  header {
    display: flex; align-items: center; gap: 18px;
    padding: 20px 40px; position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid transparent; transition: border-color .3s;
  }
  header.scrolled {
    border-bottom-color: var(--line);
    background: color-mix(in srgb, var(--bg) 96%, transparent);
  }
  .brand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
  .brand h1 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: var(--tracking); }
  .brand h1 em { color: var(--accent); font-style: normal; }
  .brand .sub { font-size: 11px; color: var(--text-faint); letter-spacing: .22em; }
  nav { display: flex; gap: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; backdrop-filter: blur(10px); }
  nav button {
    appearance: none; border: 0; background: transparent; color: var(--text-dim);
    font: 500 13px/1 var(--font-body); letter-spacing: .05em;
    padding: 9px 17px; border-radius: 999px; cursor: pointer;
    transition: color .2s, background .25s;
  }
  nav button:hover { color: var(--text); }
  nav button.active { background: var(--accent-dim); color: var(--accent); }
  #theme-switch {
    appearance: none; background: var(--card); border: 1px solid var(--line);
    color: var(--text-dim); font: 500 12.5px/1 var(--font-body);
    padding: 10px 14px; border-radius: 999px; cursor: pointer; outline: none;
    transition: border-color .2s, color .2s;
  }
  #theme-switch:hover { border-color: var(--accent); color: var(--text); }

  main { padding: 0 40px 80px; max-width: 1320px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  /* ================= 落地页 ================= */
  #landing {
    max-width: 620px; margin: 13vh auto 0; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  #landing .mark {
    width: 84px; height: 84px; border-radius: 26px;
    background: linear-gradient(145deg, var(--accent-dim), transparent 70%);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    font-family: var(--font-display); font-size: 40px; color: var(--accent);
    box-shadow: var(--glow); animation: float 5s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  #landing h2 { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: var(--tracking); }
  #landing p { color: var(--text-dim); font-size: 14px; max-width: 46ch; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font: 500 14px/1 var(--font-body);
    padding: 13px 28px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(8px);
    transition: border-color .2s, background .2s, transform .18s, box-shadow .2s;
  }
  .btn:hover { border-color: var(--accent); background: var(--card-hover); transform: translateY(-1px); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); box-shadow: 0 8px 28px var(--accent-dim); }
  .btn.ghost { background: transparent; }
  .hint { font-size: 12px; color: var(--text-faint); }

  /* ================= 首页 Hero ================= */
  .hero {
    display: grid; grid-template-columns: 1.15fr .85fr; gap: 30px; align-items: center;
    padding: 64px 0 40px; min-height: 340px;
  }
  .hello {
    font-size: 13px; letter-spacing: .3em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 18px; display: flex; align-items: center; gap: 12px;
  }
  .hello::before { content: ""; width: 34px; height: 1px; background: var(--accent); }
  .hero-title {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(38px, 4.6vw, 60px); line-height: 1.18; letter-spacing: var(--tracking);
    margin-bottom: 20px;
  }
  .hero-title .hl {
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  /* 动态评价较长时收敛字号，保持 hero 节奏 */
  .hero-title.long { font-size: clamp(26px, 3vw, 40px); line-height: 1.4; letter-spacing: 0; font-weight: 700; }
  .hero-essence { color: var(--text-dim); font-size: 15px; max-width: 52ch; margin-bottom: 28px; }
  .hero-essence strong { color: var(--accent); font-weight: 600; }
  .hero-actions { display: flex; gap: 12px; }

  /* 主题星云：漂浮的标签 */
  .nebula { position: relative; height: 320px; perspective: 700px; }
  .neb-tag {
    position: absolute; padding: 8px 18px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(10px);
    font-size: 13px; color: var(--text); white-space: nowrap; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
    animation: nebFloat var(--dur, 7s) ease-in-out infinite alternate;
    transition: border-color .2s, color .2s;
  }
  .neb-tag:hover { border-color: var(--accent); color: var(--accent); }
  .neb-tag b { font-family: var(--font-num); color: var(--accent); margin-left: 6px; font-weight: 500; }
  @keyframes nebFloat {
    from { transform: translate3d(0, calc(var(--amp) * -1), 0) rotate(-1.5deg); }
    to { transform: translate3d(0, var(--amp), 0) rotate(1.5deg); }
  }

  /* 主题签名视觉容器（默认隐藏，由主题风格包启用并定位） */
  .sig { display: none; }
  .sig canvas { display: block; }
  #sig-ambient { position: fixed; inset: 0; z-index: -2; pointer-events: none; }

  /* 趋势条：数据驱动的近况摘要 */
  .trend-row { display: flex; gap: 10px; flex-wrap: wrap; margin: -8px 0 24px; }
  .trend {
    font-size: 12px; color: var(--text-dim); letter-spacing: .04em;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
    background: var(--card); backdrop-filter: blur(8px);
  }
  .trend b { font-family: var(--font-num); color: var(--accent); font-weight: 600; margin-right: 5px; }

  /* ================= 立体统计卡 ================= */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; perspective: 900px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px 26px; position: relative; overflow: hidden;
    backdrop-filter: blur(12px); box-shadow: var(--glow);
    transform-style: preserve-3d; transition: transform .18s ease-out, border-color .25s;
    will-change: transform;
  }
  .stat:hover { border-color: var(--accent); }
  .stat .num {
    font-family: var(--font-num); font-size: 42px; font-weight: 700; line-height: 1;
    letter-spacing: -.02em; transform: translateZ(34px);
  }
  .stat .label { font-size: 12.5px; color: var(--text-dim); letter-spacing: .1em; margin-top: 10px; transform: translateZ(20px); }
  .stat .spark { position: absolute; right: -18px; top: -18px; width: 90px; height: 90px; border-radius: 50%; background: var(--accent); opacity: .07; filter: blur(24px); }

  /* ================= 面板与栅格 ================= */
  .dash-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 26px 28px; backdrop-filter: blur(12px); box-shadow: var(--glow);
    transition: border-color .25s;
  }
  .panel:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .panel h3 {
    font-size: 12px; font-weight: 600; letter-spacing: .2em; color: var(--text-dim);
    margin-bottom: 18px; display: flex; align-items: center; gap: 12px;
  }
  .panel h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .rail { display: flex; flex-direction: column; gap: 16px; }

  .persona-md h1, .persona-md h2 { font-family: var(--font-display); font-size: 18px; margin: 16px 0 10px; color: var(--accent); font-weight: 700; letter-spacing: var(--tracking); }
  .persona-md h1:first-child, .persona-md h2:first-child { margin-top: 0; }
  .persona-md p, .persona-md li { font-size: 14px; }
  .persona-md ul { padding-left: 20px; }
  .persona-md li { margin-bottom: 5px; }
  .persona-md blockquote { border-left: 2px solid var(--accent); padding-left: 12px; color: var(--text-dim); font-size: 13px; margin-bottom: 10px; }
  .persona-md strong { color: var(--accent); font-weight: 600; }

  .tag-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .tag-bar .name { width: 76px; font-size: 13px; flex-shrink: 0; }
  .tag-bar .track { flex: 1; height: 7px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; }
  .tag-bar .fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 4px; width: 0; transition: width 1s cubic-bezier(.2,.7,.2,1); }
  .tag-bar .count { font-size: 12px; color: var(--text-faint); width: 26px; text-align: right; font-family: var(--font-num); }

  .material-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .material-item:last-child { border-bottom: 0; }
  .material-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; opacity: .75; }
  .material-item .mname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .mini-plan { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .mini-plan:last-child { border-bottom: 0; }
  .mini-plan .mp-t { font-size: 13.5px; font-weight: 600; margin-bottom: 7px; }
  .mini-plan:hover .mp-t { color: var(--accent); }
  .mini-plan .mp-bar { height: 5px; background: var(--bg-soft); border-radius: 3px; overflow: hidden; }
  .mini-plan .mp-fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .8s ease; }

  /* ================= 卡片页 ================= */
  .toolbar { display: flex; align-items: center; gap: 10px; margin: 26px 0 22px; flex-wrap: wrap; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text-dim);
    font: 500 12.5px/1 var(--font-body); padding: 8px 15px; border-radius: 999px; cursor: pointer;
    transition: all .2s; backdrop-filter: blur(8px);
  }
  .chip:hover { color: var(--text); border-color: var(--text-faint); transform: translateY(-1px); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .search-box {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: 400 13px/1 var(--font-body); padding: 10px 16px; border-radius: 999px; outline: none;
    min-width: 200px; backdrop-filter: blur(8px); transition: border-color .2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-faint); }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; perspective: 900px; }
  .kcard {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px 26px; cursor: pointer; display: flex; flex-direction: column; gap: 13px;
    backdrop-filter: blur(12px); box-shadow: var(--glow);
    transform-style: preserve-3d; transition: transform .18s ease-out, border-color .25s;
    will-change: transform;
  }
  .kcard:hover { border-color: var(--accent); }
  .kcard .ctitle { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.55; letter-spacing: var(--tracking); transform: translateZ(24px); }
  .kcard .cmeta { display: flex; gap: 12px; font-size: 12px; color: var(--text-faint); transform: translateZ(16px); }
  .kcard .csummary { font-size: 13.5px; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; transform: translateZ(10px); }
  .kcard .ctags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; transform: translateZ(18px); }
  .mini-tag { font-size: 11.5px; color: var(--accent); background: var(--accent-dim); padding: 3px 11px; border-radius: 999px; letter-spacing: .04em; }

  /* ================= 弹窗 ================= */
  #modal-mask {
    position: fixed; inset: 0; background: rgba(4, 5, 8, .68); backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 4vh 4vw;
  }
  #modal-mask.open { display: flex; }
  #modal {
    background: var(--card-solid); border: 1px solid var(--line); border-radius: 20px;
    width: min(880px, 100%); max-height: 90vh; overflow: hidden auto;
    padding: 36px 42px; position: relative; box-shadow: 0 40px 100px rgba(0,0,0,.6);
    animation: modalIn .3s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
  #modal .close-x { position: absolute; top: 20px; right: 22px; appearance: none; border: 0; background: transparent; color: var(--text-faint); font-size: 24px; cursor: pointer; line-height: 1; }
  #modal .close-x:hover { color: var(--text); }
  #modal h2 { font-family: var(--font-display); font-size: 23px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; padding-right: 34px; letter-spacing: var(--tracking); }
  #modal .mmeta { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-faint); margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  #modal .mmeta a { color: var(--accent); text-decoration: none; }
  #modal .mbody { border-top: 1px solid var(--line); padding-top: 18px; }
  .mbody h2 { font-size: 13px !important; font-family: var(--font-body) !important; letter-spacing: .18em !important; color: var(--accent); margin: 22px 0 10px !important; padding-right: 0 !important; }
  .mbody ul { padding-left: 20px; }
  .mbody li { margin-bottom: 7px; font-size: 14.5px; }
  .mbody p { font-size: 14.5px; color: var(--text-dim); margin-bottom: 8px; }
  #modal .edit-area {
    width: 100%; min-height: 320px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    font: 13.5px/1.75 ui-monospace, "SF Mono", Menlo, monospace; resize: vertical;
  }
  #modal .edit-area:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; align-items: center; }

  /* ================= 规划页 ================= */
  .plan-list { display: flex; flex-direction: column; gap: 16px; margin-top: 26px; }
  .plan-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 26px 28px; backdrop-filter: blur(12px); box-shadow: var(--glow);
    transition: border-color .25s;
  }
  .plan-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .plan-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .plan-head .ptitle { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: var(--tracking); }
  .status-badge { font-size: 11px; letter-spacing: .08em; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-dim); }
  .status-badge.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
  .plan-meta { font-size: 12px; color: var(--text-faint); margin-left: auto; font-family: var(--font-num); }
  .plan-goal { font-size: 13.5px; color: var(--text-dim); margin-top: 8px; }
  .progress-row { display: flex; align-items: center; gap: 14px; margin: 16px 0 12px; }
  .progress-track { flex: 1; height: 6px; background: var(--bg-soft); border-radius: 3px; overflow: hidden; }
  .progress-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 3px; transition: width .4s ease; }
  .progress-num { font-size: 12px; color: var(--text-faint); font-family: var(--font-num); }
  .task { display: flex; align-items: flex-start; gap: 11px; padding: 8px 0; font-size: 14px; border-bottom: 1px dashed var(--line); }
  .task:last-child { border-bottom: 0; }
  .task input[type="checkbox"] {
    appearance: none; width: 18px; height: 18px; border: 1.5px solid var(--text-faint);
    border-radius: 6px; margin-top: 4px; cursor: pointer; flex-shrink: 0; position: relative; transition: all .15s;
  }
  .task input[type="checkbox"]:hover { border-color: var(--accent); }
  .task input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .task input[type="checkbox"]:checked::after {
    content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--accent-text); font-size: 11px; font-weight: 700;
  }
  .task.done .tt { color: var(--text-faint); text-decoration: line-through; }
  .plan-basis { margin-top: 14px; font-size: 13px; color: var(--text-faint); border-top: 1px solid var(--line); padding-top: 12px; }

  /* ================= 图谱 / 时间线 ================= */
  #graph-box {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    height: calc(100vh - 190px); min-height: 500px; overflow: hidden; margin-top: 26px;
    backdrop-filter: blur(12px); box-shadow: var(--glow);
  }
  .tl { position: relative; padding-left: 30px; margin-top: 26px; }
  .tl::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 1px; background: linear-gradient(var(--accent), var(--line)); }
  .tl-month { margin-bottom: 34px; position: relative; }
  .tl-month::before {
    content: ""; position: absolute; left: -26px; top: 9px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-dim), 0 0 18px var(--accent);
  }
  .tl-month .mname { font-family: var(--font-num); font-size: 18px; font-weight: 700; margin-bottom: 12px; letter-spacing: .04em; }
  .tl-item {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 20px; margin-bottom: 10px; cursor: pointer; backdrop-filter: blur(10px);
    transition: border-color .2s, transform .2s;
  }

<script>
"use strict";
/* ================================================================
   Self-Mentor 工作台 v2 · 单文件应用
   数据 = self-mentor/ 文件夹（File System Access API 本地读写）
   主题 = 完整风格包（CSS 变量 + 整段覆盖 CSS），可经 ui/themes/*.json 扩展
   ?demo=1 演示数据 · ?theme=<id> 指定主题
   ================================================================ */

const state = {
  dirHandle: null, demo: false,
  cards: [], materials: [], plans: [],
  persona: "", memory: "", snapshots: [],
  logs: [], inboxCount: 0,
  writable: false, theme: "aurum",
  filter: { q: "", tag: null, view: "cards" },
};

const $ = s => document.querySelector(s);
const dayStr = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2400); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ================= 主题风格包 =================
   每套主题 = CSS 变量（vars）+ 整段样式覆盖（css，可改排版/布局/组件气质）。
   自定义扩展：ui/themes/*.json，格式 {"name","mode","source","vars":{},"css":"..."} */
const THEMES = {
  aurum: { label: "暗金 · 默认", mode: "dark", vars: {}, css: "" },
  /* 其余风格包全部来自 ui/themes/*.json（refero 复刻版），见 loadCustomThemes */
};
let appliedVarKeys = [];
function applyTheme(id) {
  const t = THEMES[id];
  if (!t) return;
  const rs = document.documentElement.style;
  appliedVarKeys.forEach(k => rs.removeProperty(k));
  appliedVarKeys = Object.keys(t.vars || {});
  appliedVarKeys.forEach(k => rs.setProperty(k, t.vars[k]));
  rs.colorScheme = t.mode || "dark";
  $("#theme-css").textContent = t.css || "";
  state.theme = id;
  try { localStorage.setItem("sm-theme", id); } catch {}
  const sw = $("#theme-switch");
  if (sw && sw.value !== id) sw.value = id;
  setTimeout(renderSignature, 60);
  if ($("#page-graph").classList.contains("active")) setTimeout(renderGraph, 30);
}
function refreshThemeSwitcher() {
  const sw = $("#theme-switch");
  sw.innerHTML = Object.entries(THEMES).map(([k, t]) => `<option value="${k}">${esc(t.label.split("·")[0].trim())}</option>`).join("");
  sw.value = state.theme;
}
function registerTheme(id, obj) {
  THEMES[id] = {
    label: obj.name || id,
    mode: obj.mode === "light" ? "light" : "dark",
    source: obj.source || "",
    vars: typeof obj.vars === "object" && obj.vars ? obj.vars : {},
    css: typeof obj.css === "string" ? obj.css : "",
    signature: obj.signature && typeof obj.signature === "object" ? obj.signature : null,
  };
}

async function loadCustomThemes() {
  if (state.dirHandle) {
    /* 文件夹模式：直接遍历 ui/themes/ 目录 */
    try {
      const tDir = await (await state.dirHandle.getDirectoryHandle("ui")).getDirectoryHandle("themes");
      for await (const e of tDir.values()) {
        if (e.kind !== "file" || !e.name.endsWith(".json") || e.name === "index.json") continue;
        try { registerTheme(e.name.replace(/\.json$/, ""), JSON.parse(await (await e.getFile()).text())); }
        catch (err) { console.warn("主题文件解析失败", e.name, err); }
      }
    } catch { /* 没有 themes 目录就跳过 */ }
  } else {
    /* 演示 / HTTP 模式：读 manifest 清单再逐个 fetch */
    try {
      const idx = await (await fetch("themes/index.json")).json();
      for (const f of idx.themes || []) {
        try { registerTheme(f.replace(/\.json$/, ""), await (await fetch("themes/" + encodeURIComponent(f))).json()); }
        catch (err) { console.warn("主题加载失败", f, err); }
      }
    } catch { /* 无 manifest */ }
  }
}

/* 前期选定的默认风格：ui/config.json {"theme":"<主题文件名去 .json>"} */
async function loadDefaultTheme() {
  try {
    let obj = null;
    if (state.dirHandle) {
      obj = JSON.parse(await (await (await (await state.dirHandle.getDirectoryHandle("ui")).getFileHandle("config.json")).getFile()).text());
    } else {
      obj = await (await fetch("config.json")).json();
    }
    if (obj && obj.theme && THEMES[obj.theme]) return obj.theme;
  } catch { /* 无配置文件 */ }
  return "";
}

/* ================= 数据层 ================= */
function dateStr(v) {
  if (v instanceof Date) return dayStr(v); // jsyaml 会把 frontmatter 日期解析成 Date；用本地日期避免 UTC 偏一天
  return String(v || "");
}

function splitFM(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(text);
  if (!m) return [{}, text];
  let fm = {};
  try { fm = jsyaml.load(m[1]) || {}; } catch (e) { console.warn("frontmatter 解析失败", e); }
  return [fm, m[2]];
}

function parseCard(name, text) {
  const [fm, body] = splitFM(text);
  const list = v => Array.isArray(v) ? v.map(String) : (v ? [String(v)] : []);
  return {
    file: name, raw: text,
    id: String(fm.id || name.replace(/\.md$/, "")),
    title: String(fm.title || name.replace(/\.md$/, "")),
    source: String(fm.source || ""),
    url: String(fm.url || ""),
    date: dateStr(fm.date),
    tags: list(fm.tags),
    related: list(fm.related),
    body: body.trim(),
  };
}

function parsePlan(name, text) {
  const [fm, body] = splitFM(text);
  const sec = t => (new RegExp("##\\s*" + t + "\\s*\\n([\\s\\S]*?)(?=\\n##\\s|$)").exec(body) || [, ""])[1].trim();
  const tasks = [];
  body.split(/\r?\n/).forEach(line => {
    const t = /^\s*-\s*\[( |x|X)\]\s*(.*)$/.exec(line);
    if (t) tasks.push({ done: t[1].toLowerCase() === "x", text: t[2].trim() });
  });
  return {
    file: name, raw: text,
    title: String(fm.title || name.replace(/\.md$/, "")),
    created: dateStr(fm.created), updated: dateStr(fm.updated),
    status: String(fm.status || "active"),
    goal: sec("目标"), basis: sec("依据"), tasks,
  };
}

function toggleTaskLine(raw, idx) {
  let n = -1;
  return raw.split(/\r?\n/).map(line => {
    if (/^\s*-\s*\[( |x|X)\]\s*/.test(line)) {
      n++;
      if (n === idx) return line.replace(/\[( |x|X)\]/, m => m === "[ ]" ? "[x]" : "[ ]");
    }
    return line;
  }).join("\n");
}

async function subDir(handle, ...names) {
  let h = handle;
  for (const n of names) h = await h.getDirectoryHandle(n);
  return h;
}

async function readMdFiles(dirHandle) {
  const out = [];
  for await (const e of dirHandle.values()) {
    if (e.kind === "file" && e.name.endsWith(".md"))
      out.push({ name: e.name, text: await (await e.getFile()).text() });
  }
  out.sort((a, b) => a.name.localeCompare(b.name));
  return out;
}

async function writeFile(handle, names, content) {
  const dir = await subDir(handle, ...names.slice(0, -1));
  const fh = await dir.getFileHandle(names[names.length - 1], { create: true });
  const w = await fh.createWritable();
  await w.write(content);
  await w.close();
}

async function loadFromFolder(handle) {
  state.cards = (await readMdFiles(await subDir(handle, "wiki", "cards"))).map(f => parseCard(f.name, f.text));
  state.materials = (await readMdFiles(await subDir(handle, "raw", "articles"))).map(f => ({
    name: f.name,
    title: (/^#\s+(.*)$/m.exec(f.text) || [, f.name.replace(/\.md$/, "")])[1].trim(),
  }));
  state.plans = (await readMdFiles(await subDir(handle, "plans"))).map(f => parsePlan(f.name, f.text));
  const personaDir = await subDir(handle, "persona");
  try { state.persona = await (await (await personaDir.getFileHandle("SELF_PERSONA.md")).getFile()).text(); } catch { state.persona = ""; }
  try { state.memory = await (await (await personaDir.getFileHandle("SELF_MEMORY.md")).getFile()).text(); } catch { state.memory = ""; }

    (function tick(t) {

      el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(tick);

  });
}

/* 全屏环境粒子场：signature.ambient = {"count":80,"colors":["#…"],"shape":"tri|dot"} */
function renderAmbient(cfg) {
  if (ambRAF) { cancelAnimationFrame(ambRAF); ambRAF = null; }
  let cv = document.getElementById("sig-ambient");
  if (!cfg || !cfg.count) { if (cv) cv.remove(); return; }
  if (!cv) { cv = document.createElement("canvas"); cv.id = "sig-ambient"; document.body.prepend(cv); }
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d");
  const cols = cfg.colors && cfg.colors.length ? cfg.colors : ["#ffffff"];
  const shape = cfg.shape === "dot" ? "dot" : "tri";
  const pts = [];
  for (let i = 0; i < cfg.count; i++) pts.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18,
    c: cols[i % cols.length], s: 1 + Math.random() * 2.2, a: .10 + Math.random() * .22,
  });
  (function frame() {
    if (!cv.isConnected) return;
    ambRAF = requestAnimationFrame(frame);
    if (!ambAlive()) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.c;
      if (shape === "tri") {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - p.s);
        ctx.lineTo(p.x - p.s * .87, p.y + p.s * .6);
        ctx.lineTo(p.x + p.s * .87, p.y + p.s * .6);
        ctx.closePath(); ctx.fill();
      } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s * .5, 0, 6.2832); ctx.fill(); }
    }

  }
  const T = sig.type;
  if (!["globe", "stars", "earth", "adam", "brain", "network"].includes(T)) return;
  const cv = document.createElement("canvas");
  host.appendChild(cv);
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  const W = host.clientWidth || 400, H = host.clientHeight || 400;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d");
  const cols = sig.colors && sig.colors.length ? sig.colors : ["#ffffff"];
  const dot = (x, y, r, c, a) => { ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); };

  /* 伪随机（种子固定，构图稳定） */
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  /* ---- globe：均匀球面粒子 ---- */
  if (T === "globe") {
    const N = sig.count || 1100, R = Math.min(W, H) * 0.44;
    const shape = sig.shape === "dot" ? "dot" : "tri";
    const speed = sig.speed || 0.0035;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = i * 2.399963;
      pts.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r, c: cols[i % cols.length], s: .8 + ((i * 7) % 10) / 12 });
    }
    let rot = 0;
    const tilt = 0.32, sinT = Math.sin(tilt), cosT = Math.cos(tilt);
    (function frame() {

      sigRAF = requestAnimationFrame(frame);
      if (!sigAlive()) return;
      rot += speed;
      const sinR = Math.sin(rot), cosR = Math.cos(rot);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      for (const p of pts) {
        const x1 = p.x * cosR - p.z * sinR, z1 = p.x * sinR + p.z * cosR;
        const y2 = p.y * cosT - z1 * sinT, z2 = p.y * sinT + z1 * cosT;
        const persp = 1.7 / (1.7 + z2);
        const sx = W / 2 + x1 * R * persp, sy = H / 2 + y2 * R * persp;
        const front = 1 - (z2 + 1) / 2;
        ctx.globalAlpha = .08 + front * .85;
        ctx.fillStyle = p.c;
        const sz = p.s * persp * (shape === "tri" ? 2.6 : 1.7);
        if (shape === "tri") {
          ctx.beginPath();
          ctx.moveTo(sx, sy - sz);
          ctx.lineTo(sx - sz * .87, sy + sz * .6);
          ctx.lineTo(sx + sz * .87, sy + sz * .6);

  if (T === "stars") {

      x: rnd() * W, y: rnd() * H,

      ph: rnd() * 6.28, w: .4 + rnd() * 1.2, big: rnd() > .9,

    const links = [];
    stars.forEach((a, i) => {

      ctx.clearRect(0, 0, W, H);
      for (const [i, j] of links) {
        const a = stars[i], b = stars[j];
        line(a.x, a.y, b.x, b.y, a.c, .16 + .08 * Math.sin(t * .8 + a.ph), 1);
      }
      for (const s of stars) {
        const tw = .5 + .5 * Math.sin(t * s.w + s.ph);
        dot(s.x, s.y, s.s * (s.big ? 1.9 : 1), s.c, .3 + tw * .7);
        if (s.big) { // 亮星十字星芒
          line(s.x - s.s * 4, s.y, s.x + s.s * 4, s.y, s.c, .25 * tw, 1);
          line(s.x, s.y - s.s * 4, s.x, s.y + s.s * 4, s.c, .25 * tw, 1);
        }
      }
      ctx.globalAlpha = 1;
    })();
    return;
  }

  /* ---- earth：点阵地球——大陆团块遮蔽 + 自转 ---- */
  if (T === "earth") {
    const N = sig.count || 1600, R = Math.min(W, H) * 0.44;
    /* 粗略大陆团块：[纬度, 经度, 角半径°] */
    const LAND = [
      [50, -100, 22], [35, -96, 12], [15, -92, 7], [72, -40, 7],
      [-8, -62, 13], [-28, -64, 9], [-38, -70, 5],
      [6, 20, 18], [-14, 26, 11], [12, 8, 9], [-26, 28, 6],
      [48, 20, 10], [55, 60, 22], [58, 95, 20], [62, 130, 14],
      [30, 110, 13], [22, 78, 9], [36, 138, 5], [2, 114, 7],
      [-25, 134, 11], [-40, 145, 4],
    ];
    const land = (lat, lon) => LAND.some(([a, o, r]) => {
      const dLat = lat - a, dLon = Math.min(Math.abs(lon - o), 360 - Math.abs(lon - o));
      return Math.sqrt(dLat * dLat + (dLon * Math.cos(a * .01745)) ** 2) < r;
    });
    const landC = cols[0], oceanC = cols[1] || cols[0], hiC = cols[2] || cols[0];
    const pts = [];
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = i * 2.399963;
      const lat = Math.asin(y) * 57.2958, lon = Math.atan2(Math.sin(th) * r, Math.cos(th) * r) * 57.2958;
      const isLand = land(lat, lon);
      if (!isLand && i % 2 !== 0) continue; // 海洋稀疏
      pts.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r, land: isLand, s: isLand ? 1.3 + rnd() * 1.4 : .8 });
    }
    let rot = sig.rot0 || 2.2;
    const tilt = 0.41, sinT = Math.sin(tilt), cosT = Math.cos(tilt), speed = sig.speed || 0.0025;
    (function frame() {
      if (!cv.isConnected) return;
      sigRAF = requestAnimationFrame(frame);
      if (!sigAlive()) return;
      rot += speed;
      const sinR = Math.sin(rot), cosR = Math.cos(rot);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      for (const p of pts) {
        const x1 = p.x * cosR - p.z * sinR, z1 = p.x * sinR + p.z * cosR;
        const y2 = p.y * cosT - z1 * sinT, z2 = p.y * sinT + z1 * cosT;
        const persp = 1.7 / (1.7 + z2);
        const front = 1 - (z2 + 1) / 2;
        const sx = W / 2 + x1 * R * persp, sy = H / 2 + y2 * R * persp;
        const a = p.land ? .22 + front * .78 : .05 + front * .18;
        dot(sx, sy, p.s * persp, p.land ? (front > .96 ? hiC : landC) : oceanC, a);
      }
      ctx.globalAlpha = 1;
    })();
    return;
  }

  /* ---- adam：创世纪——两只将近相触的手（点绘） ---- */
  if (T === "adam") {
    /* 归一化坐标的手臂/手指锥形带：[x1,y1,x2,y2,起点宽,终点宽]（横向相触构图） */
    const SEGS = [
      [0.00, 0.58, 0.20, 0.545, .15, .10],   // 左臂
      [0.20, 0.545, 0.36, 0.515, .10, .07],  // 左前臂
      [0.36, 0.515, 0.43, 0.50, .07, .05],   // 左腕
      [0.415, 0.50, 0.49, 0.475, .028, .011],// 左食指（伸向中心）
      [0.40, 0.525, 0.46, 0.515, .020, .012],// 左拇指
      [0.385, 0.545, 0.44, 0.545, .018, .012],// 左蜷指
      [1.00, 0.40, 0.82, 0.425, .14, .095],  // 右臂
      [0.82, 0.425, 0.70, 0.455, .095, .065],// 右前臂
      [0.70, 0.455, 0.645, 0.465, .065, .048],// 右腕
      [0.66, 0.46, 0.535, 0.477, .024, .010],// 右食指（向下够）
      [0.685, 0.485, 0.63, 0.49, .018, .012],// 右拇指
    ];
    const dots = [];
    for (const [x1, y1, x2, y2, w1, w2] of SEGS) {
      const len = Math.hypot(x2 - x1, y2 - y1);
      const n = Math.round(len * 900 * (w1 + w2));
      const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
      for (let i = 0; i < n; i++) {
        const t = rnd(), w = (w1 + (w2 - w1) * t) / 2;
        const off = (rnd() + rnd() + rnd() - 1.5) / 1.5 * w; // 中心密集的三角分布
        dots.push({
          x: (x1 + (x2 - x1) * t + nx * off) * W, y: (y1 + (y2 - y1) * t + ny * off) * H,
          s: .9 + rnd() * rnd() * 3.4, c: cols[Math.floor(rnd() * cols.length)],
          a: .35 + rnd() * .6, ph: rnd() * 6.28,
        });
      }
    }
    /* 背景散点 */
    for (let i = 0; i < 130; i++) dots.push({
      x: rnd() * W, y: rnd() * H, s: .6 + rnd() * 1.4,
      c: cols[Math.floor(rnd() * cols.length)], a: .05 + rnd() * .12, ph: rnd() * 6.28,
    });
    const gapX = 0.513 * W, gapY = 0.476 * H; // 将近相触点
    let t = 0;
    (function frame() {
      if (!cv.isConnected) return;
      sigRAF = requestAnimationFrame(frame);
      if (!sigAlive()) return;
      t += 0.016;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      for (const d of dots) dot(d.x, d.y, d.s, d.c, d.a * (.82 + .18 * Math.sin(t * .7 + d.ph)));
      /* 触点辉光 */
      const pulse = .5 + .5 * Math.sin(t * 1.6);
      dot(gapX, gapY, 2.2 + pulse * 1.6, cols[0], .5 + pulse * .5);
      dot(gapX, gapY, 8 + pulse * 6, cols[0], .08 + pulse * .07);
      ctx.globalAlpha = 1;
    })();
    return;
  }

  /* ---- brain：大脑神经网络——皮质轮廓 + 节点突触 + 脉冲 ---- */
  if (T === "brain") {
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.36;
    const outline = [];
    for (let i = 0; i < 220; i++) { // 皮质褶皱轮廓（双半球 + 顶部中裂）
      const th = (i / 220) * 6.2832;
      const fissure = Math.max(0, 1 - Math.abs(Math.abs(((th * 57.2958 + 90) % 180) - 90) - 90) / 14);
      const r = R * (1 + .07 * Math.sin(th * 7) + .04 * Math.sin(th * 13)) * (1 - fissure * .12);
      outline.push({ x: cx + Math.cos(th) * r * 1.12, y: cy + Math.sin(th) * r * .88, ph: rnd() * 6.28 });
    }
    const nodes = [];
    for (let i = 0; i < 64; i++) {
      const th = rnd() * 6.2832, rr = Math.sqrt(rnd()) * R * .82;
      nodes.push({ x: cx + Math.cos(th) * rr * 1.12, y: cy + Math.sin(th) * rr * .88, s: 1.4 + rnd() * 2.4, c: cols[i % cols.length], ph: rnd() * 6.28 });
    }
    const edges = [];
    nodes.forEach((a, i) => nodes.forEach((b, j) => {
      if (j > i && (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (R * .34) ** 2 && edges.length < 150) edges.push([i, j]);
    }));
    const pulses = [];
    for (let i = 0; i < 6; i++) pulses.push({ e: Math.floor(rnd() * edges.length), t: rnd(), sp: .004 + rnd() * .008 });
    let t = 0;
    (function frame() {
      if (!cv.isConnected) return;
      sigRAF = requestAnimationFrame(frame);
      if (!sigAlive()) return;
      t += 0.016;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      for (const o of outline) dot(o.x, o.y, 1.6, cols[0], .5 + .3 * Math.sin(t + o.ph));
      for (const [i, j] of edges) line(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y, cols[0], .16, 1);
      for (const p of pulses) { // 沿突触游走的信号脉冲
        p.t += p.sp; if (p.t > 1) { p.t = 0; p.e = Math.floor(Math.random() * edges.length); }
        const [i, j] = edges[p.e], a = nodes[i], b = nodes[j];
        dot(a.x + (b.x - a.x) * p.t, a.y + (b.y - a.y) * p.t, 1.8, cols[(p.e + 1) % cols.length], .85);
      }
      for (const n of nodes) {
        const glow = .5 + .5 * Math.sin(t * 1.1 + n.ph);
        dot(n.x, n.y, n.s, n.c, .5 + glow * .5);
      }
      ctx.globalAlpha = 1;
    })();
    return;
  }

  /* ---- network：生长的知识网络——节点渐次点亮、呼吸漂移 ---- */
  if (T === "network") {
    const N = sig.count || 42, R = Math.min(W, H);
    const nodes = [];
    for (let i = 0; i < N; i++) nodes.push({
      x: W * .5 + (rnd() - .5) * W * .8, y: H * .5 + (rnd() - .5) * H * .8,
      s: 1.4 + rnd() * rnd() * 5, c: cols[i % cols.length],
      born: i / N, ph: rnd() * 6.28,
    });
    const edges = [];
    nodes.forEach((a, i) => {
      const near = nodes.map((b, j) => [((a.x - b.x) ** 2 + (a.y - b.y) ** 2), j])
        .filter(([d, j]) => j !== i).sort((x, y) => x[0] - y[0]).slice(0, 2);
      for (const [d, j] of near) if (j > i && d < (R * .3) ** 2) edges.push([i, j]);
    });
    let t = 0;
    (function frame() {
      if (!cv.isConnected) return;
      sigRAF = requestAnimationFrame(frame);
      if (!sigAlive()) return;
      t += 0.008;
      const grow = Math.min(1, t / 1.1); // 入场后网络渐显
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const px = nodes.map(n => n.x + Math.sin(t * 2 + n.ph) * 4);
      const py = nodes.map(n => n.y + Math.cos(t * 1.6 + n.ph) * 4);
      for (const [i, j] of edges) {
        const a = Math.min(nodes[i].born, nodes[j].born) < grow ? .22 : 0;
        if (a) line(px[i], py[i], px[j], py[j], cols[0], a + .05 * Math.sin(t * 2 + i), 1);
      }
      nodes.forEach((n, i) => {
        if (n.born > grow) return;
        const tw = .5 + .5 * Math.sin(t * 2.2 + n.ph);
        dot(px[i], py[i], n.s, n.c, .45 + tw * .55);
        if (n.s > 3.4) dot(px[i], py[i], n.s * 2.6, n.c, .06 + tw * .05); // 大节点光晕
      });
      ctx.globalAlpha = 1;
    })();
    return;
  }
}

  el.innerHTML = `

      <div class="hero-title${hero.headline && hero.headline.length > 16 ? " long" : ""}">${hero.headline ? esc(hero.headline) : `你的认知，<br>正在被<span class="hl">蒸馏</span>成形`}</div>
      <p class="hero-essence">${esc(hero.essence) || "打开目录并完成第一次蒸馏后，这里会显示对你的详细解读。"}</p>
      <div class="trend-row">

        <span class="trend"><b>${trend.r30}</b>近 30 天卡片</span>
        ${trend.hotTags.length ? `<span class="trend">活跃主题 · ${trend.hotTags.map(esc).join(" / ")}</span>` : ""}
        ${trend.plans ? `<span class="trend">进行中规划 <b>${trend.plans}</b> · 均进度 <b>${trend.prog}%</b></span>` : ""}
      </div>
      <div class="hero-actions">
        <button class="btn primary" data-go="cards">进入知识卡片</button>
        <button class="btn ghost" data-go="graph">查看知识图谱</button>
      </div>
    </div>
    <div class="nebula" id="nebula"></div>
  </div>

  <div class="stat-row reveal">
    ${stats.map(([n, label]) => `
      <div class="stat"><i class="spark"></i>
        <div class="num" data-count="${n}">0</div>
        <div class="label">${label}</div>
      </div>`).join("")}
  </div>

  <div class="dash-grid">
    <div class="panel reveal">
      <h3>自我画像 · PERSONA</h3>
      <div class="persona-md">${personaIntro ? md(personaIntro) : "<p style='color:var(--text-faint)'>尚未生成画像。和 WorkBuddy 聊聊，让它蒸馏出第一个你。</p>"}</div>
    </div>
    <div class="rail">
      <div class="panel reveal">
        <h3>主题分布</h3>
        ${tags.slice(0, 6).map(([t, c]) => `
          <div class="tag-bar"><span class="name">${esc(t)}</span>
            <span class="track"><span class="fill" data-w="${Math.round(c / maxTag * 100)}"></span></span>
            <span class="count">${c}</span>
          </div>`).join("") || "<p style='color:var(--text-faint);font-size:13px'>还没有标签。</p>"}
      </div>
      <div class="panel reveal">
        <h3>进行中的规划</h3>
        ${activePlans.map(p => `
          <div class="mini-plan" data-plan="${esc(p.file)}">
            <div class="mp-t">${esc(p.title)}</div>
            <div class="mp-bar"><span class="mp-fill" style="width:${Math.round(planProgress(p) * 100)}%"></span></div>
          </div>`).join("") || "<p style='color:var(--text-faint);font-size:13px'>还没有学习规划。</p>"}
      </div>
      <div class="panel reveal">
        <h3>素材库 · 快照</h3>
        ${state.materials.slice(0, 4).map(m => `<div style="font-size:13px;padding:5px 0;color:var(--text-dim)">📄 ${esc(m.title)}</div>`).join("")}
        ${state.snapshots.length ? `<div style="font-size:12px;color:var(--text-faint);margin-top:8px">最近画像快照：${esc(state.snapshots[0])}（共 ${state.snapshots.length} 份）</div>` : ""}
      </div>
    </div>
  </div>

  <h2 class="sec-title">认知剖面 · 画像的深度解读</h2>
  <div id="insight-part"></div>`;

  const neb = $("#nebula");
  const nebEls = tags.slice(0, 8).map(([t, c], i) => {
    const s = document.createElement("span");
    s.className = "neb-tag";
    s.style.fontSize = (12 + Math.min(c, 4) * 2) + "px";
    s.style.setProperty("--amp", (8 + (i * 7) % 12) + "px");
    s.style.setProperty("--dur", (5.5 + (i * 1.3) % 4) + "s");
    s.style.zIndex = 10 - i;
    s.innerHTML = `${esc(t)}<b>${c}</b>`;
    s.onclick = () => { state.filter.tag = t; showPage("cards"); };
    neb.appendChild(s);
    return s;
  });
  /* 防重叠：测量真实尺寸后做矩形排斥迭代，预留漂浮振幅（--amp 最大约 19px）的净空 */
  requestAnimationFrame(() => {
    if (!neb.isConnected) return;
    const W = neb.clientWidth, H = neb.clientHeight;
    if (!W || !H) return;
    const items = nebEls.map((el, i) => ({
      el, w: el.offsetWidth, h: el.offsetHeight,
      x: (0.05 + ((i * 37) % 60) / 100) * W,
      y: (0.04 + ((i * 53) % 70) / 100) * H,
    }));
    const GX = 26, GY = 44;
    for (let iter = 0; iter < 90; iter++) {
      for (let a = 0; a < items.length; a++) for (let b = a + 1; b < items.length; b++) {
        const A = items[a], B = items[b];
        const dx = (B.x + B.w / 2) - (A.x + A.w / 2);
        const dy = (B.y + B.h / 2) - (A.y + A.h / 2);
        const ox = (A.w + B.w) / 2 + GX - Math.abs(dx);
        const oy = (A.h + B.h) / 2 + GY - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          if (ox < oy) { const p = ox / 2 * (dx >= 0 ? 1 : -1); A.x -= p; B.x += p; }
          else { const p = oy / 2 * (dy >= 0 ? 1 : -1); A.y -= p; B.y += p; }
        }
      }
      items.forEach(it => {
        /* 预留漂浮振幅（--amp 最大约 19px）+ 旋转余量 + 主题描边框，保证任何时刻不出框 */
        const M = 28;
        it.x = Math.max(M, Math.min(W - it.w - M, it.x));
        it.y = Math.max(M, Math.min(H - it.h - M, it.y));
      });
    }
    items.forEach(it => { it.el.style.left = it.x + "px"; it.el.style.top = it.y + "px"; });
  });

  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => showPage(b.dataset.go));
  el.querySelectorAll(".mini-plan").forEach(b => b.onclick = () => showPage("plans"));
  observeReveals(el); initTilt(el); countUp(el); renderSignature();
  requestAnimationFrame(() => el.querySelectorAll(".tag-bar .fill").forEach(f => f.style.width = f.dataset.w + "%"));
}

    (!f.tag || c.tags.includes(f.tag)) &&

          <div class="kcard" data-id="${esc(c.id)}">

            <div class="cmeta"><span>${esc(c.date)}</span><span>${esc(c.source)}</span></div>
            <div class="csummary">${esc(c.body.replace(/^#.*$/gm, "").replace(/[\-\*\>\[\]]/g, "").trim().slice(0, 120))}</div>
            <div class="ctags">${c.tags.map(t => `<span class="mini-tag">${esc(t)}</span>`).join("")}</div>
          </div>`).join("") || "<p style='color:var(--text-faint)'>没有匹配的卡片。</p>"}

  $("#card-search").oninput = e => { state.filter.q = e.target.value; renderCards(); $("#card-search").focus(); const v = $("#card-search"); v.setSelectionRange(v.value.length, v.value.length); };

function copyText(t) {
  const ok = () => toast("已复制，发给 Workbuddy 吧");
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(ok, () => toast("复制失败"));
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); ok(); } catch { toast("复制失败"); }
  ta.remove(); return Promise.resolve();
}

function buildSuggestions() {
  const out = [];
  const P = personaSections();
  P.gaps.slice(0, 3).forEach(g => out.push({

    hint: "补充相关素材后，让 Workbuddy 重新蒸馏画像",
    copy: "我补充了新素材，请重新蒸馏并验证画像里的待验证项",
  }));
  tagCounts().filter(([, c]) => c === 1).slice(0, 3).forEach(([t]) => out.push({
    icon: "✚", text: `「${t}」目前只有 1 张卡片，证据单薄`,
    hint: "围绕它再读 2-3 篇，导入后蒸馏", tag: t,
  }));
  state.plans.filter(p => p.status === "active").forEach(p => {
    const upd = new Date(p.updated || p.created || 0).getTime();
    if (upd && Date.now() - upd > 7 * 864e5) out.push({
      icon: "⏳", text: `规划「${p.title}」已超过 7 天没有更新`,
      hint: "让它复盘进度、调整任务",
      copy: `复盘我的规划「${p.title}」，根据最近的卡片更新任务和进度`,
    });
  });
  if (state.inboxCount > 0) out.push({
    icon: "⬇", text: `inbox/ 里有 ${state.inboxCount} 份素材待蒸馏`,
    hint: "蒸馏后卡片、画像、规划会联动更新",
    copy: "蒸馏 inbox/ 里的新素材，更新我的观照台",
  });
  if (state.logs.length >= 7 && state.snapshots.length < 2) out.push({
    icon: "◎", text: "已积累一周以上的数据，但画像快照不足，趋势还画不出来",

  return out;
}

async function toggleTask(file, idx) {
  const p = state.plans.find(x => x.file === file);

  renderPlans();
}

/* ================= 图谱 ================= */
let graphNet = null;
function renderGraph() {
  const box = $("#graph-box");
  if (!box || !state.cards.length) { if (box) box.innerHTML = "<p style='padding:40px;color:var(--text-faint)'>暂无卡片。</p>"; return; }
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const ids = new Set(state.cards.map(c => c.id));
  /* 度统计：节点大小随连接数增长 */
  const deg = {};
  state.cards.forEach(c => c.related.forEach(r => { if (ids.has(r)) { deg[c.id] = (deg[c.id] || 0) + 1; deg[r] = (deg[r] || 0) + 1; } }));
  /* 完整标题按 7 字折行，不再截断 */
  const wrap = t => { const s = []; for (let i = 0; i < t.length; i += 7) s.push(t.slice(i, i + 7)); return s.join("\n"); };
  const nodes = state.cards.map(c => ({
    id: c.id, label: wrap(c.title), title: c.title,
    shape: "dot", size: 9 + Math.min(5, deg[c.id] || 0) * 3,
    color: { background: col("--accent"), border: col("--accent"), highlight: { background: col("--accent-2") || col("--accent"), border: col("--accent-2") || col("--accent") }, hover: { background: col("--accent-2") || col("--accent"), border: col("--accent-2") || col("--accent") } },
    font: { color: col("--text"), size: 12.5, face: "sans-serif", vadjust: 8 },
    borderWidth: 0,
  }));
  const edges = [];
  state.cards.forEach(c => c.related.forEach(r => {
    if (ids.has(r)) edges.push({ from: c.id, to: r, color: { color: col("--line"), highlight: col("--accent"), hover: col("--accent") }, width: 1.2 });
  }));
  box.innerHTML = "";
  graphNet = new vis.Network(box, { nodes, edges }, {
    physics: { solver: "forceAtlas2Based", forceAtlas2Based: { gravitationalConstant: -60, springLength: 180 }, stabilization: { iterations: 160 } },
    interaction: { hover: true, hoverConnectedEdges: true, zoomView: true, dragView: true },
    edges: { smooth: { type: "continuous" } },
  });
  /* 稳定后自动取景，节点少时不再缩在角落；settle 幂等，事件 + 定时双保险 */
  const settle = () => { if (!graphNet) return; graphNet.stopSimulation(); graphNet.fit({ padding: 60, maxZoomLevel: 1.5, animation: { duration: 500, easingFunction: "easeInOutQuad" } }); };
  graphNet.once("stabilizationIterationsDone", settle);
  setTimeout(settle, 1000);
  graphNet.on("click", p => { if (p.nodes.length) openCard(p.nodes[0]); });
}

/* ================= 洞察页 =================
   全部从 persona / log / 卡片 frontmatter 解析，不需要后端。
   persona 小节识别（别名兼容）：思维框架|用什么框架看世界、决策模式、
   绝对不做的事|红线、待验证|认知盲区、Correction 记录。 */
function personaSections() {
  const secs = {};
  let cur = null;
  for (const l of state.persona.split(/\r?\n/)) {
    const m = /^##\s+(.*)$/.exec(l.trim());
    if (m) { cur = m[1].trim(); secs[cur] = []; }
    else if (cur) secs[cur].push(l);
  }
  const find = (...names) => {
    for (const k of Object.keys(secs)) if (names.some(n => k.includes(n))) return secs[k].join("\n");
    return "";
  };
  const bullets = txt => txt.split(/\r?\n/).filter(l => /^\s*[-*]\s+/.test(l)).map(l => l.replace(/^\s*[-*]\s+/, "").trim()).filter(Boolean);
  return {
    frameworks: bullets(find("思维框架", "用什么框架看世界")).map(l => {
      const name = (/^\*\*(.+?)\*\*/.exec(l) || [, l.split(/[：:]/)[0]])[1].trim();
      const links = [...l.matchAll(/\[\[(.+?)\]\]/g)].map(m => m[1]);
      const desc = l.replace(/^\*\*.+?\*\*\s*[：:]?\s*/, "").replace(/（\[\[.+?\]\](,?\s*\[\[.+?\]\])*）/g, "").replace(/\[\[.+?\]\]/g, "").trim();
      return { name, desc, links };
    }),
    bipolar: bullets(find("决策模式")).map(l => {
      const m = /^(.+?)\s*[↔\-–—]\s*(.+?)\s*[：:]\s*(\d+)/.exec(l);
      return m ? { left: m[1].trim(), right: m[2].trim(), val: Math.min(100, Math.max(0, +m[3])) } : null;
    }).filter(Boolean),
    redlines: bullets(find("绝对不做", "红线", "底线")),
    gaps: bullets(find("待验证", "盲区", "素材不足")),
    corrections: bullets(find("Correction", "修正")),
  };
}

function renderInsight() {
  const el = $("#insight-part");
  if (!el) return;
  const P = personaSections();
  const empty = `<p class="insight-empty">这一维度还没有蒸馏出来。继续喂素材、和 Workbuddy 聊，它会随画像一起生长。</p>`;
  /* 热力图：近 18 周 × 7 天 */
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const weeks = [];
  const logMap = Object.fromEntries(state.logs.map(l => [l.date, l.ops]));
  const start = new Date(today); start.setDate(start.getDate() - start.getDay() - 17 * 7);
  let maxOps = 1;
  for (let w = 0; w < 18; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) {
      const dt = new Date(start); dt.setDate(dt.getDate() + w * 7 + d);
      if (dt > today) { col.push(-1); continue; }
      const ops = logMap[dayStr(dt)] || 0;
      maxOps = Math.max(maxOps, ops);
      col.push(ops);
    }
    weeks.push(col);
  }
  const lvl = n => n <= 0 ? "" : " l" + Math.min(4, Math.ceil(n / maxOps * 4));
  const heat = `<div class="heatmap">${weeks.map(col => `<div class="hm-col">${col.map(n => n < 0 ? `<div class="hm-cell" style="visibility:hidden"></div>` : `<div class="hm-cell${lvl(n)}" title="${n} 次操作"></div>`).join("")}</div>`).join("")}</div>
    <div class="hm-legend">少 <div class="hm-cell"></div><div class="hm-cell l2"></div><div class="hm-cell l4"></div> 多 · 来自 log/ 操作日志</div>`;

  /* 成长曲线：近 12 周卡片累计（sparkline），全部从卡片日期推导 */
  const W = 12, wkMs = 7 * 864e5, nowMs = Date.now();
  const weekOps = new Array(W).fill(0);
  state.logs.forEach(l => {
    const i = Math.floor((nowMs - new Date(l.date + "T00:00:00").getTime()) / wkMs);
    if (i >= 0 && i < W) weekOps[W - 1 - i] += l.ops;
  });
  const cum = [];
  const cardTimes = state.cards.map(c => new Date(c.date || 0).getTime());
  for (let w = 0; w < W; w++) {
    const edge = nowMs - (W - 1 - w) * wkMs;
    cum.push(cardTimes.filter(t => t <= edge).length);
  }
  const maxC = Math.max(1, ...cum);
  const pts = cum.map((v, i) => `${(i / (W - 1) * 100).toFixed(1)},${(34 - v / maxC * 30).toFixed(1)}`).join(" ");
  const growth = `<svg class="growth-svg" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="0,34 ${pts}" fill="none" stroke="var(--accent)" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
      <circle cx="100" cy="${(34 - cum[cum.length - 1] / maxC * 30).toFixed(1)}" r="1.8" fill="var(--accent)"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-faint);margin-top:6px">
      <span>12 周前</span>
      <span>累计 <b style="color:var(--text)">${cum[cum.length - 1]}</b> 张卡片 · 期间 <b style="color:var(--text)">${weekOps.reduce((a, b) => a + b, 0)}</b> 次蒸馏操作</span>
      <span>现在</span>
    </div>`;

  el.innerHTML = `
  <div class="insight-grid">
    <div class="panel reveal wide">
      <h3>成长曲线 · 认知积累</h3>
      ${state.cards.length ? growth : empty}
    </div>
    <div class="panel reveal wide">
      <h3>决策模式 · 双极量尺</h3>
      ${P.bipolar.length ? `<div class="bipolar">${P.bipolar.map(b => `
        <div class="bp-row">
          <div class="bp-ends"><b>${esc(b.left)}</b><span class="bp-val">${b.val}%</span><b>${esc(b.right)}</b></div>
          <div class="bp-track"><div class="bp-fill" style="width:${b.val}%"></div><div class="bp-thumb" style="left:${b.val}%"></div></div>
        </div>`).join("")}</div>` : empty}
    </div>
    <div class="panel reveal wide">
      <h3>判断框架 · 你用来看世界的透镜</h3>
      ${P.frameworks.length ? `<div class="fw-wall">${P.frameworks.map(f => `
        <div class="fw-card">
          <div class="fw-name">${esc(f.name)}</div>
          <div class="fw-desc">${esc(f.desc)}</div>
          ${f.links.length ? `<div class="fw-links">${f.links.map(l => `<a href="#" data-rel="${esc(l)}">[[${esc(l)}]]</a>`).join("")}</div>` : ""}
        </div>`).join("")}</div>` : empty}
    </div>
    <div class="panel reveal">
      <h3>红线 · 绝对不做的事</h3>
      ${P.redlines.length ? `<div class="red-list">${P.redlines.map(r => `<div class="red-item">${esc(r)}</div>`).join("")}</div>` : empty}
    </div>
    <div class="panel reveal">
      <h3>认知盲区 · 待验证</h3>
      ${P.gaps.length ? `<div class="gap-list">${P.gaps.map(g => `<div class="gap-item">${esc(g)}</div>`).join("")}</div>` : empty}
    </div>
    <div class="panel reveal">
      <h3>修正史 · Correction</h3>
      ${P.corrections.length ? P.corrections.map(c => `<div class="corr-item">${esc(c)}</div>`).join("") : empty}
    </div>
    <div class="panel reveal">
      <h3>活动节律</h3>
      ${heat}
    </div>
  </div>

  ${state.persona ? `<details class="persona-full reveal">
    <summary>完整画像原文 · SELF_PERSONA.md（含核心价值观、成长轨迹等全部小节）</summary>
    <div class="persona-md">${md(state.persona)}</div>
  </details>` : ""}`;
  el.querySelectorAll("[data-rel]").forEach(a => a.onclick = e => { e.preventDefault(); openCard(a.dataset.rel); });
  observeReveals(el);
}

/* ================= 文档导入 =================
   文件夹模式：写入 inbox/，由 Agent（Workbuddy / 本 skill）下次蒸馏时消费；
   演示/HTTP 模式：仅在当前会话内存中加入素材列表。 */
async function importFiles(files) {
  const list = [...files].filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  if (!list.length) { toast("只支持 .md / .txt 文档"); return; }
  if (state.dirHandle && state.writable) {
    try {
      const inbox = await state.dirHandle.getDirectoryHandle("inbox", { create: true });
      for (const f of list) {
        const fh = await inbox.getFileHandle(Date.now() + "-" + f.name.replace(/\.(txt|markdown)$/i, ".md"), { create: true });
        const w = await fh.createWritable();
        await w.write(await f.text());
        await w.close();
      }
      state.inboxCount += list.length;
      setStatus();
      toast(`已收进 inbox/ · ${list.length} 份 —— 对 Workbuddy 说「蒸馏新素材」，它会自动分析并更新观照台`);
    } catch (e) { toast("写入失败：" + e.message); }
  } else {
    for (const f of list) {
      const text = await f.text();
      state.materials.push({ name: f.name, title: (/^#\s+(.*)$/m.exec(text) || [, f.name.replace(/\.\w+$/, "")])[1].trim() });
    }
    renderAll();
    toast(`演示模式：已临时加入 ${list.length} 份素材（不落盘）。文件夹模式可写入 inbox/`);
  }
}

/* ================= 卡片弹窗 ================= */
function openCard(id) {
  const c = state.cards.find(x => x.id === id);
  if (!c) return;
  const canEdit = state.writable && !state.demo;
  $("#modal-content").innerHTML = `
    <h2>${esc(c.title)}</h2>
    <div class="mmeta">
      <span>${esc(c.date)}</span><span>${esc(c.source)}</span>
      ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">原文 ↗</a>` : ""}
      ${c.tags.map(t => `<span class="mini-tag">${esc(t)}</span>`).join("")}
      ${c.related.map(r => `<a href="#" data-rel="${esc(r)}" style="color:var(--accent);text-decoration:none">→ ${esc(r)}</a>`).join("")}
    </div>
    <div class="mbody persona-md">${md(c.body)}</div>
    ${canEdit ? `<div style="margin-top:18px;text-align:right"><button class="btn ghost" id="card-edit-btn" style="padding:8px 18px;font-size:12.5px">编辑卡片原文</button></div>` : ""}`;
  $("#modal-content").querySelectorAll("[data-rel]").forEach(a => a.onclick = e => { e.preventDefault(); openCard(a.dataset.rel); });
  if (canEdit) $("#card-edit-btn").onclick = () => enterCardEdit(c);
  $("#modal-mask").classList.add("open");
}

/* 卡片编辑：人在回路的关键入口。直接编辑 markdown 原文（含 frontmatter），保存即写回 wiki/cards/ */
function enterCardEdit(c) {
  $("#modal-content").innerHTML = `
    <h2>编辑卡片 · ${esc(c.id)}</h2>
    <textarea class="card-edit-area" id="card-edit-area" spellcheck="false">${esc(c.raw)}</textarea>
    <div style="display:flex;gap:10px;margin-top:14px;align-items:center">
      <button class="btn primary" id="card-save">保存写回</button>
      <button class="btn ghost" id="card-cancel">取消</button>
      <span class="sugg-hint">人的修改永远优先——保存后下次蒸馏以你的版本为准</span>
    </div>`;
  $("#card-save").onclick = async () => {
    const raw = $("#card-edit-area").value;
    try {
      await writeFile(state.dirHandle, ["wiki", "cards", c.file], raw);
      Object.assign(c, parseCard(c.file, raw));
      renderAll(); openCard(c.id);
      toast("已写回 wiki/cards/" + c.file);
    } catch (e) { toast("保存失败：" + e.message); }
  };
  $("#card-cancel").onclick = () => openCard(c.id);
}

/* ================= 页面切换 & 启动 ================= */
function showPage(name) {
  /* 旧栏目名兼容：洞察并入观照页，时间线并入知识页 */
  if (name === "insight") name = "dashboard";
  if (name === "timeline") { name = "cards"; state.filter.view = "timeline"; renderCards(); }
  document.querySelectorAll(".page").forEach(p => p.style.display = "none");
  const pg = $("#page-" + name);
  pg.style.display = "block";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.page === name));
  window.scrollTo(0, 0);
  if (name === "graph") setTimeout(renderGraph, 30);
}

function setStatus() {
  $("#st-source").innerHTML = state.demo ? "数据源：演示数据" : `数据源：<span class="ok">${esc(state.dirHandle ? state.dirHandle.name : "")}</span>${state.writable ? "（可写）" : ""}`;
  $("#st-cards").innerHTML = `卡片 <span class="ok">${state.cards.length}</span> · 素材 <span class="ok">${state.materials.length}</span> · 规划 <span class="ok">${state.plans.length}</span>`;
  $("#st-persona").innerHTML = (state.persona ? "画像 <span class='ok'>✓</span>" : "画像缺失")
    + (state.inboxCount ? ` · 待蒸馏 <span class='ok'>${state.inboxCount}</span>` : "");
}

function renderAll() {
  renderDashboard(); renderInsight(); renderCards(); renderPlans(); renderTimeline();
  setStatus();
}

async function boot(loader) {
  await loader();
  await loadCustomThemes();
  refreshThemeSwitcher();
  const urlTheme = new URLSearchParams(location.search).get("theme");
  const saved = localStorage.getItem("sm-theme");
  const cfgTheme = await loadDefaultTheme();
  applyTheme(
    urlTheme && THEMES[urlTheme] ? urlTheme :
    saved && THEMES[saved] ? saved :
    cfgTheme || "aurum");
  $("#landing").style.display = "none";
  $("#tabs").style.display = "flex";
  $("#btn-import").style.display = "";
  $("#status-bar").style.display = "flex";
  renderAll();
  showPage("dashboard");
}

$("#btn-open").onclick = async () => {
  try {
    const h = await window.showDirectoryPicker({ mode: "readwrite" });
    state.dirHandle = h;
    await boot(() => loadFromFolder(h));
    toast("已加载 " + h.name);
  } catch (e) { if (e.name !== "AbortError") toast("打开失败：" + e.message); }
};
$("#btn-demo").onclick = () => boot(async () => loadDemo());
$("#btn-reload").onclick = async () => {
  if (state.demo) { loadDemo(); renderAll(); toast("已重置演示数据"); return; }
  if (!state.dirHandle) return;
  await loadCustomThemes();
  refreshThemeSwitcher();
  await loadFromFolder(state.dirHandle);
  renderAll();
  toast("已重新读取");
};
$("#modal-close").onclick = () => $("#modal-mask").classList.remove("open");
$("#modal-mask").onclick = e => { if (e.target === $("#modal-mask")) $("#modal-mask").classList.remove("open"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal-mask").classList.remove("open"); });
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showPage(b.dataset.page));
/* 导入：按钮 + 全局拖拽 */
$("#btn-import").onclick = () => $("#import-input").click();
$("#import-input").addEventListener("change", e => { importFiles(e.target.files); e.target.value = ""; });
let dragDepth = 0;
window.addEventListener("dragenter", e => {
  if (![...e.dataTransfer.types].includes("Files")) return;
  if (!state.demo && !state.dirHandle) return; // 还没打开目录/演示时不响应
  dragDepth++;
  $("#drop-mask").classList.add("on");
  e.preventDefault();
});
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("#drop-mask").classList.remove("on"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0;
  $("#drop-mask").classList.remove("on");
  if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
});
$("#theme-switch").addEventListener("change", e => {
  applyTheme(e.target.value);
  if ($("#page-graph").style.display === "block") setTimeout(renderGraph, 30);
});
window.addEventListener("scroll", () => {
  $("#topbar").classList.toggle("scrolled", window.scrollY > 10);
  const max = document.documentElement.scrollHeight - innerHeight;
  $("#scroll-progress").style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + "%";
}, { passive: true });

/* URL 直启：?demo=1 演示，?theme=<id> 主题 */
(function autoStart() {
  const q = new URLSearchParams(location.search);
  if (q.get("theme") && THEMES[q.get("theme")]) { /* boot 时读取 */ }
  if (q.get("demo") === "1") boot(async () => loadDemo()).then(() => { const p = q.get("page"); if (p) showPage(p); const c = q.get("card"); if (c) openCard(c); });
  else $("#landing-hint").textContent = "提示：加 ?demo=1 可直接进入演示；?theme=<id> 可指定风格。";
})();
</script>
</body>
</html>
